# Fly.io-Konfiguration fuer das Backend. Der App-Name steht unten und wird
# aus DIESER Datei gelesen - flyctl muss sie also finden. Am robustesten mit
# dem Arbeitsverzeichnis als Positionsargument, dann ist kein cd noetig:
#   flyctl deploy <pfad>/backend --ha=false
# Mit cd geht es auch, aber nur aus dem backend-Ordner heraus:
#   cd backend && flyctl deploy --ha=false
# Aus dem Wurzelverzeichnis scheitert es, weil der App-Name fehlt.
#
# --ha=false ist Pflicht. Ohne den Schalter legt Fly beim Deploy eine zweite
# Maschine fuer Hochverfuegbarkeit an (so geschehen beim ersten Deploy am
# 28.08.2026). Zwei Maschinen teilen weder den Poller-Zustand noch den
# Graph-Cache: jede pollt die DB-APIs eigenstaendig und fuellt ihren eigenen
# Overpass-Cache. Genau die Verdopplung, die Konzeptkorrektur 1 vermeiden
# will. min_machines_running unten ist eine Unter-, keine Obergrenze.

app = "umstieg-backend"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3001"
  OSM_VOLUME_PFAD = "/data/osm"

[http_service]
  internal_port = 3001
  force_https = true

  # Die Maschine darf NICHT schlafen gelegt werden. Beim Herunterfahren
  # sterben der EVA-Poller, alle offenen SSE-Verbindungen und der
  # Graph-Cache – genau die drei Dinge, deretwegen das Backend ueberhaupt
  # dauerhaft laeuft (siehe Dockerfile).
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  # 512 MB, weil der LRU-Cache bis zu 100 OSM-Graphen im Speicher haelt.
  memory = "512mb"
  cpus = 1

# OSM-Bestand (Spec 2026-10-12): was das Backend selbst holt oder erneuert,
# ueberlebt Neustarts und Deploys. Ein Volume gehoert zu genau einer Maschine
# - passend zu --ha=false.
[mounts]
  source = "osm_daten"
  destination = "/data"
