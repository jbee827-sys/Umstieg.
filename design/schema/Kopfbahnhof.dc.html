<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: 'Archivo', system-ui, sans-serif; background: #f3f2f2; color: #201e1d;
           -webkit-font-smoothing: antialiased; }
    a { color: #ec3013; } a:hover { color: #ae1800; }
    button { font-family: inherit; }
    /* Eine Zeile, die nie in ihren Nachbarn laeuft. */
    .zeile { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
    .zeile > .haupt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .zeile > .neben { flex: none; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .marke { font-size: 10px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; }
  </style>
</helmet>

<div style="width: 402px; height: 874px; display: flex; flex-direction: column; background: #f3f2f2; overflow: hidden">

  <!-- KOPF -->
  <div style="padding: 54px 18px 14px; display: flex; align-items: center; gap: 14px; border-bottom: 1px solid #e0dcdc">
    <button style="flex: none; width: 36px; height: 36px; border-radius: 999px; border: none; background: #e8e5e5; display: grid; place-items: center; cursor: pointer">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3a3737" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
    </button>
    <div style="flex: 1; min-width: 0">
      <div style="font-weight: 800; font-size: 20px; line-height: 1.1; letter-spacing: -.01em">Gleis 16</div>
      <div style="font-size: 12px; color: #6b6767; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">Leipzig Hbf · Kopfbahnhof</div>
    </div>
    <div style="flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 1px; padding: 7px 13px; border-radius: 15px; background: #fdf3e0">
      <div style="display: flex; align-items: center; gap: 6px">
        <span style="width: 8px; height: 8px; border-radius: 50%; background: #e08a00"></span>
        <span style="font-weight: 800; font-size: 17px; font-variant-numeric: tabular-nums; color: #e08a00; line-height: 1.1">09:30</span>
      </div>
      <div class="marke" style="font-size: 9px; color: #a86800">3:45 Puffer</div>
    </div>
  </div>

  <!-- SCHEMA -->
  <div style="flex: 1; min-height: 0; background: #eae8e8; padding: 12px 12px 0; display: flex; flex-direction: column">

    <div style="display: flex; gap: 6px; margin-bottom: 10px">
      <sc-for list="{{ standorte }}" as="st" hint-placeholder-count="3">
        <button onClick="{{ st.waehle }}" style="flex: 1; min-height: 40px; border-radius: 12px; border: {{ st.rahmen }}; background: {{ st.flaeche }}; color: {{ st.tinte }}; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px">
          <span style="font-size: 11px; font-weight: 700; letter-spacing: -.01em">{{ st.name }}</span>
          <span style="font-size: 10px; font-weight: 600; font-variant-numeric: tabular-nums; opacity: .8">{{ st.zeit }}</span>
        </button>
      </sc-for>
    </div>

    <div class="zeile" style="margin-bottom: 10px">
      <span class="haupt marke" style="color: #8e8a8a">Ebene {{ aktiv.name }}</span>
      <span class="neben" style="display: flex; align-items: center; gap: 11px; font-size: 9px; color: #8e8a8a">
        <span style="display: flex; align-items: center; gap: 4px"><span style="width: 12px; height: 2px; background: #6b6767"></span>Rolltreppe</span>
        <span style="display: flex; align-items: center; gap: 4px"><span style="width: 12px; height: 0; border-top: 2px dashed #6b6767"></span>Treppe</span>
        <span style="display: flex; align-items: center; gap: 4px"><span style="width: 7px; height: 7px; border: 1.5px solid #6b6767; border-radius: 1.5px"></span>Aufzug</span>
      </span>
    </div>

    <div style="display: flex; flex-direction: column">
      <sc-for list="{{ baender }}" as="band" hint-placeholder-count="3">

        <div style="height: {{ band.hoehe }}px; box-sizing: border-box; border-radius: {{ band.radius }}px; background: {{ band.flaeche }}; border: {{ band.rahmen }}; padding: {{ band.polster }}; display: flex; flex-direction: column; justify-content: {{ band.ausrichtung }}; overflow: hidden">

          <div class="zeile">
            <span class="haupt marke" style="color: {{ band.tinte }}">{{ band.titel }}</span>
            <span class="neben marke" style="color: {{ band.tinteNeben }}; font-weight: 500">{{ band.rechts }}</span>
          </div>

          <sc-if value="{{ band.aktiv }}" hint-placeholder-val="{{ true }}">
            <div style="flex: 1; min-height: 0; margin-top: 8px">
              <svg width="{{ band.svgW }}" height="{{ band.svgH }}" viewBox="0 0 {{ band.svgW }} {{ band.svgH }}" style="display: block; shape-rendering: geometricPrecision">

                <sc-for list="{{ band.netz }}" as="n" hint-placeholder-count="20">
                  <path d="{{ n.d }}" fill="none" stroke="#c9c4c4" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
                </sc-for>

                <sc-for list="{{ band.bahnsteige }}" as="bs" hint-placeholder-count="5">
                  <line x1="{{ bs.x1 }}" y1="{{ bs.y }}" x2="{{ bs.x2 }}" y2="{{ bs.y }}" stroke="{{ bs.farbe }}" stroke-width="{{ bs.dicke }}" stroke-linecap="round"/>
                  <text x="{{ bs.lx }}" y="{{ bs.ly }}" font-family="Archivo, sans-serif" font-size="10" font-weight="{{ bs.gewicht }}" fill="{{ bs.schrift }}" text-anchor="end">{{ bs.gleise }}</text>
                </sc-for>

                <sc-for list="{{ band.striche }}" as="a" hint-placeholder-count="12">
                  <line x1="{{ a.x1 }}" y1="{{ a.y1 }}" x2="{{ a.x2 }}" y2="{{ a.y2 }}" stroke="{{ a.farbe }}" stroke-width="{{ a.dicke }}" stroke-linecap="butt" stroke-dasharray="{{ a.strich }}"/>
                </sc-for>
                <sc-for list="{{ band.kaesten }}" as="a" hint-placeholder-count="6">
                  <rect x="{{ a.x }}" y="{{ a.y }}" width="{{ a.w }}" height="{{ a.w }}" rx="1.5" fill="{{ a.fuellung }}" stroke="{{ a.farbe }}" stroke-width="{{ a.dicke }}"/>
                </sc-for>

                <sc-if value="{{ band.weg }}" hint-placeholder-val="{{ true }}">
                  <path d="{{ band.weg }}" fill="none" stroke="#ec3013" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                </sc-if>

                <sc-if value="{{ band.punkt }}" hint-placeholder-val="{{ false }}">
                  <circle cx="{{ band.punkt.x }}" cy="{{ band.punkt.y }}" r="10" fill="#ec3013" fill-opacity=".16"/>
                  <circle cx="{{ band.punkt.x }}" cy="{{ band.punkt.y }}" r="4.5" fill="#ec3013" stroke="#f8f4f4" stroke-width="2"/>
                </sc-if>

                <sc-if value="{{ band.notiz }}" hint-placeholder-val="{{ false }}">
                  <text x="{{ band.notiz.x }}" y="{{ band.notiz.y }}" font-family="Archivo, sans-serif" font-size="10" font-weight="700" fill="#ec3013" text-anchor="{{ band.notiz.anker }}">{{ band.notiz.text }}</text>
                </sc-if>
              </svg>
            </div>

            <sc-if value="{{ band.fuss }}" hint-placeholder-val="{{ false }}">
              <div style="margin-top: 6px; font-size: 12px; font-weight: 600; color: #ec3013; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{ band.fuss }}</div>
            </sc-if>
          </sc-if>
        </div>

        <sc-if value="{{ band.wechsel }}" hint-placeholder-val="{{ true }}">
          <div style="height: 16px; display: flex; align-items: center; justify-content: center; gap: 6px">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#9b9797" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
            <span class="marke" style="font-size: 9px; color: #9b9797">{{ band.wechsel }}</span>
          </div>
        </sc-if>
      </sc-for>
    </div>

    <div style="margin-top: auto; padding: 14px 0 26px; display: flex; align-items: flex-start; gap: 8px">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#9b9797" stroke-width="2.4" stroke-linecap="round" style="flex: none; margin-top: 1px"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></svg>
      <span style="font-size: 10px; line-height: 1.45; color: #7d7979">{{ vorbehalt }}</span>
    </div>
  </div>

  <!-- SHEET -->
  <div style="flex: none; background: #f3f2f2; border-radius: 24px 24px 0 0; margin-top: -16px; position: relative; z-index: 4; padding: 16px 0 20px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 -8px 26px rgba(45,43,43,.09)">
    <div style="display: flex; gap: 14px; align-items: center; padding: 0 20px">
      <div style="width: 48px; height: 48px; background: #ec3013; border-radius: 15px; display: grid; place-items: center; flex: none">
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#f3f2f2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="{{ schritt.icon }}"/></svg>
      </div>
      <div style="flex: 1; min-width: 0">
        <div class="marke" style="color: #8e8a8a">Schritt {{ schritt.nr }} von {{ schritt.gesamt }}</div>
        <div style="font-weight: 800; font-size: 19px; line-height: 1.2; margin-top: 4px; letter-spacing: -.01em; text-wrap: pretty">{{ schritt.titel }}</div>
      </div>
    </div>

    <div style="display: flex; gap: 3px; padding: 0 20px">
      <sc-for list="{{ balken }}" as="b" hint-placeholder-count="12">
        <div style="flex: 1; height: 4px; border-radius: 999px; background: {{ b.farbe }}"></div>
      </sc-for>
    </div>

    <div style="display: flex; gap: 10px; padding: 0 20px">
      <button onClick="{{ zurueck }}" style="min-height: 52px; width: 58px; border-radius: 999px; border: none; background: #e8e5e5; display: grid; place-items: center; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3a3737" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
      </button>
      <button onClick="{{ weiter }}" style="flex: 1; min-height: 52px; border-radius: 999px; border: none; background: #ec3013; color: #f8f4f4; font-size: 17px; font-weight: 700; letter-spacing: -.01em; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; cursor: pointer">
        <span>{{ weiterText }}</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f8f4f4" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>
  </div>
</div>
</x-dc>

/* Der Platz wird nicht gleich verteilt, sondern nach Bedarf: Die Ebene, auf
   der jemand gerade steht, bekommt fast alles; die uebrigen schrumpfen auf
   eine Zeile. Unterwegs sind sie Merkposten, kein Bild. */
const STAPEL_H = 457;   // 50 px weniger: die Standortwahl steht darueber     // Hoehe des Bandstapels im Schemabereich
const RUHIG_H = 30;       // ein Band, das nur eine Zeile ist
const WECHSEL_H = 16;     // die Zeile zwischen zwei Baendern
const BAND_W = 378;
const POLSTER = 13;

const ICONS = { rolltreppe: 'M3 18h4l8-9h6M3 18v-3M21 9V6', eben: 'M5 12h14M13 6l6 6-6 6' };

/* Ein Eintrag der Ebenenliste ist EIN BESUCH, also genau ein Linienzug. Wer
   hinunter und wieder herauf geht, hat zwei Eintraege - und zwischen ihnen
   liegt kein Weg, sondern eine Treppe. */
function laenge(weg) {
  let l = 0;
  for (let i = 1; i < (weg || []).length; i++) {
    l += Math.hypot(weg[i].x - weg[i-1].x, weg[i].y - weg[i-1].y);
  }
  return Math.round(l);
}

/* "11,12,13,14,15,16" -> "11–16". Eine Aufzaehlung passt nicht in eine Zeile,
   eine Spanne schon - und sie sagt dasselbe. */
function spanne(gleise) {
  const zahlen = gleise.filter((g) => /^\d+$/.test(g)).map(Number).sort((a, b) => a - b);
  if (zahlen.length === 0) return gleise.join(', ');
  const teile = [];
  let von = zahlen[0], letzt = zahlen[0];
  for (let i = 1; i <= zahlen.length; i++) {
    if (zahlen[i] === letzt + 1) { letzt = zahlen[i]; continue; }
    teile.push(von === letzt ? String(von) : von + '–' + letzt);
    von = zahlen[i]; letzt = zahlen[i];
  }
  return teile.join(', ');
}

class Component extends DCLogic {
  constructor(props) {
    super(props);
    // Der Standort am Ankunftsgleis ist die Eingabe, die den Weg entscheidet -
    // solange die Wagenreihung fehlt, ist er das Einzige, was ihn kennt.
    this.state = { nr: null, pos: 'anfang' };
  }

  componentDidUpdate(vorher) {
    if (vorher.schrittNr !== this.props.schrittNr) this.setState({ nr: null });
  }

  /* Grundriss einer Uebergangsebene auf die Zeichenflaeche einpassen. */
  einpassen(ebene, w, h) {
    const alle = [];
    for (const n of ebene.netz || []) alle.push(...n.punkte);
    for (const e of ebene.elemente || []) alle.push(...e.punkte);
    alle.push(...(ebene.weg || []));
    if (alle.length === 0) return null;
    const xs = alle.map((p) => p.x), ys = alle.map((p) => p.y);
    const x0 = Math.min(...xs), x1 = Math.max(...xs);
    const y0 = Math.min(...ys), y1 = Math.max(...ys);
    const rand = 16;
    const s = Math.min((w - rand * 2) / Math.max(x1 - x0, 1), (h - rand * 2) / Math.max(y1 - y0, 1), 6);
    const vx = rand + (w - rand * 2 - (x1 - x0) * s) / 2 - x0 * s;
    const vy = rand + (h - rand * 2 - (y1 - y0) * s) / 2 - y0 * s;
    // Halbe Pixel geben duennen Linien eine klare Kante statt eines Schleiers.
    return (p) => ({ x: Math.round(vx + p.x * s) + 0.5, y: Math.round(vy + p.y * s) + 0.5 });
  }

  renderVals() {
    const pos = this.state.pos ?? 'anfang';
    const daten = POSITIONEN[pos];
    const SCHEMA = daten.schema;
    const SCHRITTE = daten.schritte;
    const NAMEN = { anfang: 'Anfang', mitte: 'Mitte', ende: 'Ende' };
    const standorte = ['anfang', 'mitte', 'ende'].map((p) => ({
      name: NAMEN[p],
      zeit: Math.round(POSITIONEN[p].gehzeitSek / 60) + ' min',
      flaeche: p === pos ? '#201e1d' : '#f8f6f6',
      tinte: p === pos ? '#f8f6f6' : '#3a3737',
      rahmen: p === pos ? 'none' : '1px solid #dad6d6',
      waehle: () => this.setState({ pos: p, nr: null }),
    }));
    const nr = Math.max(1, Math.min(SCHRITTE.length, this.state.nr ?? this.props.schrittNr ?? 22));
    const aktivesLevel = SCHRITTE[nr - 1][1];
    const warDa = new Set(SCHRITTE.slice(0, nr).map((s) => s[1]));

    const anzahl = SCHEMA.ebenen.length;
    const aktivH = STAPEL_H - (anzahl - 1) * RUHIG_H - (anzahl - 1) * WECHSEL_H;

    const baender = [];
    let aktivName = '';
    let vorbehalt = 'Abschnitte A–G sind nicht verortet. Alles Übrige ist gemessen.';

    SCHEMA.ebenen.forEach((ebene, i) => {
      const istAktiv = ebene.level === aktivesLevel;
      const gleisband = ebene.art === 'gleise';
      const hoehe = istAktiv ? aktivH : RUHIG_H;
      const name = ebene.level > 0 ? '+' + ebene.level : String(ebene.level);
      const alleGleise = ebene.bahnsteige.flatMap((b) => b.gleise.split('/'));

      // Zeichenflaeche: Bandhoehe minus Polster, Kopfzeile und Fusszeile.
      const svgW = BAND_W - POLSTER * 2 - 2;
      const svgH = Math.max(40, hoehe - POLSTER * 2 - 16 - 8 - 20);

      let bahnsteige = [], netz = [], striche = [], kaesten = [];
      let punkt = null, fuss = null, notiz = null;
      let wegD = null;
      let rechts = gleisband ? 'Gleise ' + spanne(alleGleise) : laenge(ebene.weg || []) + ' m';

      if (istAktiv && gleisband) {
        // Waagerechte Balken: Reihenfolge und Abstand aus querM, Laenge
        // massstaeblich. Keine Drehung - sie machte das Bild nur schief.
        const maxL = Math.max(...ebene.bahnsteige.map((b) => b.laengeM || 1));
        const gasse = 42;
        const innenW = svgW - gasse - 18;
        const roh = ebene.bahnsteige.map((b, k) => {
          const vor = ebene.bahnsteige[k - 1];
          return vor ? Math.min(56, 26 + (b.querM - vor.querM) * 0.42) : 0;
        });
        const gesamt = roh.reduce((a, b) => a + b, 0);
        let y = (svgH - gesamt) / 2;

        ebene.bahnsteige.forEach((b, k) => {
          y += roh[k];
          const breite = Math.round(((b.laengeM || maxL) / maxL) * innenW);
          const x0 = gasse + Math.round((innenW - breite) / 2);
          const wichtig = !!b.rolle;
          bahnsteige.push({
            gleise: b.gleise, y: Math.round(y) + 0.5, x1: x0, x2: x0 + breite,
            // Der wichtige Bahnsteig traegt die Markierungen IM Balken und
            // muss dafuer dick genug sein, dass man sie unterscheidet.
            dicke: wichtig ? 13 : 3,
            farbe: b.rolle === 'ziel' ? '#ec3013' : b.rolle === 'start' ? '#201e1d' : '#c4bfbf',
            schrift: wichtig ? '#201e1d' : '#9b9797',
            gewicht: wichtig ? '800' : '600',
            lx: gasse - 10, ly: Math.round(y) + 4,
          });

          if (!wichtig) return;
          // Anlagen an ihrer gemessenen Stelle. Was dichter als sieben Meter
          // beieinanderliegt, faellt zusammen - sonst ein Fleck statt Auskunft.
          const gesehen = new Set();
          for (const a of ebene.elemente || []) {
            if (a.beiM === undefined) continue;
            const s = a.typ + ':' + Math.round(a.beiM / 7);
            if (gesehen.has(s)) continue;
            gesehen.add(s);
            const x = Math.round(x0 + (a.beiM / b.laengeM) * breite) + 0.5;
            const mitte = Math.round(y) + 0.5;
            // Die Anlage sitzt AM GLEIS, also liegt ihre Marke im Balken -
            // hell ausgespart, damit sie auf dem dunklen Bahnsteig traegt.
            if (a.typ === 'aufzug') {
              kaesten.push({ x: x - 3.5, y: mitte - 3.5, w: 7, farbe: 'none', dicke: 0, fuellung: '#f8f6f6' });
            } else {
              striche.push({
                x1: x, y1: mitte - 6, x2: x, y2: mitte + 6,
                farbe: '#f8f6f6', dicke: a.aufRoute ? 3.4 : 2,
                strich: a.typ === 'treppe' ? '2.2 2' : 'none',
              });
            }
          }
          const genutzt = (b.zugaenge || []).find((z) => z.aufRoute);
          if (genutzt) {
            const x = Math.round(x0 + (genutzt.beiM / b.laengeM) * breite);
            notiz = {
              x: Math.min(svgW - 4, Math.max(30, x)), y: Math.round(y) - 16,
              text: genutzt.beiM + ' m',
              anker: x > svgW - 40 ? 'end' : 'middle',
            };
            fuss = b.rolle === 'start'
              ? 'Abgang bei ' + genutzt.beiM + ' m · ' + genutzt.rolltreppe + ' Rolltreppen'
              : 'Aufgang bei ' + genutzt.beiM + ' m · dann ' + laenge(ebene.weg || []) + ' m bis Gleis ' + b.gleise.split('/')[1];
          }
          rechts = b.laengeM ? b.laengeM + ' m Bahnsteig' : 'Länge unbekannt';
        });
      } else if (istAktiv) {
        const bild = this.einpassen(ebene, svgW, svgH);
        if (bild) {
          for (const n of ebene.netz || []) {
            netz.push({ d: 'M ' + n.punkte.map((p) => { const q = bild(p); return q.x + ' ' + q.y; }).join(' L ') });
          }
          for (const a of ebene.elemente || []) {
            const aufR = a.aufRoute;
            if (a.punkte.length === 1 || a.typ === 'aufzug') {
              const p = bild(a.punkte[0]);
              kaesten.push({ x: p.x - 3.5, y: p.y - 3.5, w: 7, farbe: aufR ? '#ec3013' : '#7d7979', dicke: aufR ? 2.4 : 1.6, fuellung: '#f8f6f6' });
            } else {
              const p = bild(a.punkte[0]), q = bild(a.punkte[1]);
              striche.push({
                x1: p.x, y1: p.y, x2: q.x, y2: q.y,
                farbe: aufR ? '#ec3013' : '#7d7979', dicke: aufR ? 3 : 1.8,
                strich: a.typ === 'treppe' ? '3 3' : 'none',
              });
            }
          }
          if ((ebene.weg || []).length > 1) {
            wegD = 'M ' + ebene.weg.map((p) => { const q = bild(p); return q.x + ' ' + q.y; }).join(' L ');
            punkt = bild(ebene.weg[ebene.weg.length - 1]);
          }
          rechts = laenge(ebene.weg || []) + ' m';
          fuss = (ebene.netz || []).length + ' Gänge · ' + (ebene.elemente || []).length + ' Anlagen in Sicht';
        }
      }

      baender.push({
        hoehe, svgW, svgH,
        aktiv: istAktiv,
        radius: istAktiv ? 16 : 11,
        polster: istAktiv ? POLSTER + 'px' : '0 ' + POLSTER + 'px',
        ausrichtung: istAktiv ? 'flex-start' : 'center',
        titel: (gleisband ? 'Ebene ' + name : 'Ebene ' + name + ' · Übergang')
          + (ebene.rolle === 'start' ? ' · Ankunft' : ebene.rolle === 'ziel' ? ' · Abfahrt' : ''),
        rechts,
        flaeche: istAktiv ? '#f8f6f6' : warDa.has(ebene.level) ? '#e2dfdf' : '#edebeb',
        rahmen: istAktiv ? '1.5px solid #ec3013' : '1px solid #e0dcdc',
        tinte: istAktiv ? '#3a3737' : '#8e8a8a',
        tinteNeben: istAktiv ? '#8e8a8a' : '#a5a1a1',
        bahnsteige, netz, striche, kaesten, punkt, fuss, notiz,
        weg: wegD,
        wechsel: i < anzahl - 1 ? 'Rolltreppe' : null,
      });

      if (istAktiv) {
        aktivName = name;
        vorbehalt = gleisband
          ? 'Bahnsteige maßstäblich in der Länge; quer stimmt die Reihenfolge, nicht der Maßstab.'
          : 'Grundriss aus dem Kartenmaterial — Gänge, Anlagen und Weg sind gemessen.';
      }
    });

    const typ = SCHRITTE[nr - 1][0];
    return {
      baender,
      aktiv: { name: aktivName },
      vorbehalt,
      balken: SCHRITTE.map((_, i) => ({ farbe: i < nr ? '#ec3013' : '#d7d3d3' })),
      schritt: { nr, gesamt: SCHRITTE.length, titel: SCHRITTE[nr - 1][2], icon: ICONS[typ] || ICONS.eben },
      standorte,
      weiterText: nr >= SCHRITTE.length ? 'Angekommen' : 'Weiter',
      weiter: () => this.setState({ nr: Math.min(SCHRITTE.length, nr + 1) }),
      zurueck: () => this.setState({ nr: Math.max(1, nr - 1) }),
    };
  }
}
