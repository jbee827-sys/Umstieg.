# iOS-App (Plan App Store, Pakete 2 und 3).
#
# simulator:  bei jedem Push - Tests, Bau ohne Signatur, Bildschirmfotos.
# testflight: von Hand oder per Tag app-v* - signiert, Upload zu App Store
#             Connect. Braucht die Geheimnisse aus docs/app-ios.md.
#
# Das Repository ist privat (Stand 10.11.2026) - macOS-Minuten zaehlen
# zehnfach. Fehlgeschlagenes nur mit "Re-run failed jobs" wiederholen.
name: iOS

on:
  push:
    branches: [feat/app-ios]
    # Ein Tag app-v1.2.0 baut zusaetzlich fuer TestFlight (Job testflight).
    # Pfadfilter gelten fuer Tags nicht.
    tags: ['app-v*']
    paths:
      - 'frontend/**'
      - 'vercel.json'
      - '.github/workflows/ios.yml'
      - '.github/scripts/ios-bildschirmfotos.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    name: Simulator-Bau und Bildschirmfotos
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Abhaengigkeiten
        run: npm ci

      - name: Tests und Lint
        # Die Fahrplanzeiten in den Tests sind deutsche Ortszeit.
        env:
          TZ: Europe/Berlin
        run: npm test && npm run lint

      - name: App-Bau (dist-app)
        run: npm run build:app

      - name: Web-Bau ins iOS-Projekt
        run: npx cap sync ios

      - name: Firebase-Konfiguration
        # Konzept Mitteilungen 6.2: GoogleService-Info.plist kommt aus dem
        # Secret (Base64), nie aus dem Repository. Ohne Secret baut der
        # Simulator-Job trotzdem - die App laeuft dann ohne Firebase.
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > ios/App/App/GoogleService-Info.plist
            plutil -lint ios/App/App/GoogleService-Info.plist
            test "$(plutil -extract BUNDLE_ID raw ios/App/App/GoogleService-Info.plist)" = online.umstieg.app
            echo "FIREBASE_PLIST=1" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret GOOGLE_SERVICE_INFO_PLIST fehlt - Bau ohne Firebase"
          fi

      - name: Xcode
        run: xcodebuild -version && xcrun simctl list runtimes

      - name: Bau fuer den Simulator
        run: |
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/abgeleitet" \
            CODE_SIGNING_ALLOWED=NO

      - name: Teilen-Erweiterung im App-Paket
        # Paket 7: Ohne sie fehlt „Umstieg.“ im Teilen-Menue - der Bau liefe
        # trotzdem durch.
        run: |
          APP="$RUNNER_TEMP/abgeleitet/Build/Products/Debug-iphonesimulator/App.app"
          test -f "$APP/PlugIns/Teilen.appex/Info.plist"
          plutil -extract NSExtension.NSExtensionPointIdentifier raw "$APP/PlugIns/Teilen.appex/Info.plist" | grep -qx com.apple.share-services
          echo "Teilen.appex eingebettet"

      - name: Mitteilungs-Erweiterung im App-Paket
        # Plan Mitteilungen, Task 10: Ohne sie zeigt das lange Druecken einer
        # Mitteilung nur den Systemtext - der Bau liefe trotzdem durch.
        run: |
          APP="$RUNNER_TEMP/abgeleitet/Build/Products/Debug-iphonesimulator/App.app"
          test -f "$APP/PlugIns/Mitteilung.appex/Info.plist"
          plutil -extract NSExtension.NSExtensionPointIdentifier raw "$APP/PlugIns/Mitteilung.appex/Info.plist" | grep -qx com.apple.usernotifications.content-extension
          plutil -extract NSExtension.NSExtensionAttributes.UNNotificationExtensionCategory raw "$APP/PlugIns/Mitteilung.appex/Info.plist" | grep -qx reise
          test -f "$APP/PlugIns/Mitteilung.appex/Archivo.ttf"
          echo "Mitteilung.appex eingebettet"

      - name: Firebase im App-Paket
        # Der Skript-Schritt "Firebase-Konfiguration" im Xcode-Projekt kopiert
        # die Plist nur, wenn sie da ist. Auto-Init muss aus sein (Konzept 6.2).
        run: |
          APP="$RUNNER_TEMP/abgeleitet/Build/Products/Debug-iphonesimulator/App.app"
          test "$(plutil -extract FirebaseMessagingAutoInitEnabled raw "$APP/Info.plist")" = false
          if [ "${FIREBASE_PLIST:-}" = 1 ]; then
            test -f "$APP/GoogleService-Info.plist"
            echo "GoogleService-Info.plist eingebettet"
          fi

      - name: Bildschirmfotos
        # Erster Lauf (24.10.2026): 13,5 Minuten fuer 12 Fotos samt Start zweier Simulatoren.
        timeout-minutes: 25
        run: |
          bash ../.github/scripts/ios-bildschirmfotos.sh \
            "$RUNNER_TEMP/abgeleitet/Build/Products/Debug-iphonesimulator/App.app" \
            "$RUNNER_TEMP/bildschirmfotos"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-bildschirmfotos
          path: ${{ runner.temp }}/bildschirmfotos
          if-no-files-found: warn

  # Signierter Bau und Upload zu App Store Connect (Plan App Store, Paket 3).
  # Nur von Hand oder mit einem Tag app-v1.2.3 - nicht jeder Commit soll
  # einen TestFlight-Bau erzeugen. Einrichtung: docs/app-ios.md.
  testflight:
    name: Signierter Bau fuer TestFlight
    needs: simulator
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/app-v')
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frontend
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Schluessel fuer App Store Connect
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Geheimnis $name fehlt - Einrichtung siehe docs/app-ios.md"
              exit 1
            fi
          done
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey.p8"
          plutil -replace teamID -string "$APPLE_TEAM_ID" ios/ExportOptions.plist

      - name: Version und Buildnummer
        # Buildnummer: die Laufnummer dieses Ablaufs - steigt immer. Version:
        # aus dem Tag (app-v1.2.0 -> 1.2.0), sonst die im Projekt.
        run: |
          echo "BUILDNUMMER=${{ github.run_number }}" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/app-v* ]]; then
            echo "VERSION_ANGABE=MARKETING_VERSION=${GITHUB_REF#refs/tags/app-v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_ANGABE=" >> "$GITHUB_ENV"
          fi

      - name: Abhaengigkeiten
        run: npm ci

      - name: App-Bau (dist-app)
        run: npm run build:app

      - name: Web-Bau ins iOS-Projekt
        run: npx cap sync ios

      - name: Firebase-Konfiguration
        # Fuer TestFlight Pflicht: Ohne Plist kaemen keine Mitteilungen vom
        # Server an, und der Bau sahe trotzdem fertig aus.
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "::error::Geheimnis GOOGLE_SERVICE_INFO_PLIST fehlt - Einrichtung siehe README (Firebase einrichten)"
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > ios/App/App/GoogleService-Info.plist
          plutil -lint ios/App/App/GoogleService-Info.plist
          test "$(plutil -extract BUNDLE_ID raw ios/App/App/GoogleService-Info.plist)" = online.umstieg.app

      - name: Archiv
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Umstieg.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BUILDNUMMER" \
            $VERSION_ANGABE

      - name: Push im Archiv
        # Ohne aps-environment in der Signatur liefert iOS kein APNs-Token -
        # dann fehlt der Haken "Push Notifications" an der App-ID.
        run: |
          APP="$RUNNER_TEMP/Umstieg.xcarchive/Products/Applications/App.app"
          test -f "$APP/GoogleService-Info.plist"
          codesign -d --entitlements :- "$APP" 2>/dev/null | grep -q aps-environment
          echo "Firebase-Plist und aps-environment im Archiv"

      - name: Upload zu App Store Connect
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Umstieg.xcarchive" \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Schluessel entfernen
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc" ios/App/App/GoogleService-Info.plist
